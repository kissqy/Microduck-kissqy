# Journal retention for the robot.
#
# Install to /etc/systemd/journald.conf.d/10-robot.conf, then:
#   systemctl restart systemd-journald
#
# Why this file exists: systemd's default is `Storage=auto`, which keeps the journal in
# RAM (/run/log/journal) unless /var/log/journal already exists. On an image where it does
# not, every log is lost at reboot — so the one thing support always asks for ("what did it
# say before it restarted?") is exactly what is missing. `Storage=persistent` makes the
# behaviour explicit and creates the directory itself, rather than depending on whether
# some other package happened to create it.
#
# ⚠ NOT SUFFICIENT ON ITS OWN if /var/log is a tmpfs. Armbian images have shipped a
# RAM-log mechanism (armbian-ramlog / log2ram) that mounts /var/log in memory to spare the
# SD card, syncing to disk periodically and on clean shutdown. Under that, this file makes
# journald *think* it is persistent while an unclean power-off still loses recent logs —
# and a robot is powered off uncleanly all the time. Verify on the board:
#
#   findmnt /var/log                  # tmpfs here means logs are in RAM
#   systemctl status armbian-ramlog   # or log2ram
#
# See deploy/README.md for what to do about it. This is an open board-verification item
# (docs/roadmap.md, M4), not a settled one.

[Journal]
Storage=persistent

# eMMC is small and a robot runs for months, so the journal needs a ceiling. 200M with
# 20M files means roughly ten rotations kept — enough to span several boots, which is what
# makes "the logs from before the crash" reachable.
SystemMaxUse=200M
SystemMaxFileSize=20M

# Keep at least this many separate files, so hitting SystemMaxUse cannot collapse history
# down to the current boot alone.
SystemMaxFiles=10

# A robot that sat unused for months should not still be holding logs from then.
MaxRetentionSec=3month

Compress=yes

# Nothing on this image consumes syslog, so forwarding is pure CPU and IO for output
# nobody reads. (Also skips /dev/kmsg, which has its own small ring buffer.)
ForwardToSyslog=no

# Rate limiting stays on — a genuinely runaway service must not be able to fill the disk —
# but the default (1000 messages / 30s per service) is low enough to drop messages during a
# crash loop, which is precisely when every line matters. Raised, not removed.
RateLimitIntervalSec=30s
RateLimitBurst=10000
