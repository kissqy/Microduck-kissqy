# Creates the `robot` system group.
#
# Install to /usr/lib/sysusers.d/robot.conf; systemd-sysusers creates it at boot, or
# run `systemd-sysusers` once by hand.
#
# This group is the first layer of update access control: the updaterd socket is
# root:robot mode 0660, so group membership is what lets a process talk to the daemon
# at all. Being in it does NOT confer the right to change the robot — that needs
# allow_uids/allow_gids in updater.toml (see §5.4 and architecture.md §2.2).
#
# updaterd.service will fail to start if this group does not exist.
g robot -
