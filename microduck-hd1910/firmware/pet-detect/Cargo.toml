# Petting detection from the onboard microphone: a ~20 KB CNN over log-mel windows.
#
# Ported from `apirrone/microduck_pet_detect` — same features, same model, same thresholds —
# plus the arecord worker and the ambient sound sentry that lived in the prototype's
# `pet_worker.rs`, so everything that listens to the mic is one crate.
[package]
name = "pet-detect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "pet_detect"

[[bin]]
name = "pet-detect"
path = "src/bin/detect.rs"

[[bin]]
name = "pet-features"
path = "src/bin/features.rs"

[dependencies]
anyhow = "1"
clap = { workspace = true, features = ["derive"] }
hound.workspace = true
rustfft = "6.2"
tracing.workspace = true
# The same pin as duck-control: one ONNX Runtime on the board serves both.
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic"] }
