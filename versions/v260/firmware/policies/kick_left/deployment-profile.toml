# 0.15.1 的 [policy] 参数片段；合并使用，不是完整 robotd.toml。
# 仅适用于本包对应的 HD1910 自训模型；硬件驱动仍需飞特/IMU适配。
# 轮滑行走/轮滑蹲下官方推理0.8与PPO训练1.0分开记录，其他动作不套用该预设。
# 电压动作补偿、增益及增益倍率沿用运行端配置；本片段不改这些开关。
[policy]
head_lowpass = 1.0
legs_lowpass = 1.0

# 合并对应名称的技能；保留现有 path / params.gain_ratio。
# 必须另将该技能路径绑定到本模型；不要用片段替换其它技能。
[[policy.skill]]
name = "kick_left"
duration = 0.5
command = [0, 0, 0]
unwind = [0, 0, 0]
unwind_s = 0.0
chain = false
[policy.skill.params]
action_scale = 1.0

# 原生路由：skill
# R148 当前任务白名单不接收此任务；训练导出不等于现有机器人一键导入。
