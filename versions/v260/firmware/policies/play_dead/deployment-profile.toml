# 0.15.1 的 [policy] 参数片段；合并使用，不是完整 robotd.toml。
# 仅适用于本包对应的 HD1910 自训模型；硬件驱动仍需飞特/IMU适配。
# 轮滑行走/轮滑蹲下官方推理0.8与PPO训练1.0分开记录，其他动作不套用该预设。
# 电压动作补偿、增益及增益倍率沿用运行端配置；本片段不改这些开关。
[policy]

# 原生路由：skill_with_recovery_handoff
# 按随包 R148 接口审计，该版本的任务白名单不接收此任务；其他实机中控版本需核对其导入合同。
# V8训练方法＋R1.5.27 BAM的组合须由运行端按真实来源接收。已审V172/V173对hd1910-v8只接受厂家81a441…，本包不伪装成旧源码模型，也不修改机器人固件。
# 独立装死ONNX需要从稳定站姿触发，零twist/head/body运行5秒，结束时仍躺着；随后必须交给已验证起身策略。现有脚本装死不会自动调用此模型。
# 0.15.1没有每技能独立的头腿滤波覆盖；本模型训练为直通，接入端需落实匹配映射并恢复其它策略设置。本包不生成会全局改写Walk滤波的片段。
