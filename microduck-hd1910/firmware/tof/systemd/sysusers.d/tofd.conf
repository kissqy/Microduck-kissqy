# Creates the `tofd` system user and group.
#
# Install to /usr/lib/sysusers.d/tofd.conf; systemd-sysusers creates them at
# boot, or run `systemd-sysusers` once by hand.
#
# `tofd` runs unprivileged for the same reason `padd` does: it needs exactly one
# thing the operator's account does not have — the I²C bus — and that comes from
# group membership granted in tofd.service, not from being root:
#
#   i2c   — /dev/i2c-* is root:i2c mode 0660
#   robot — lets it hand its own socket to the group that may watch the robot
#
# tofd.service will fail to start if this user does not exist.
u tofd - "Robot ToF sensor daemon" - -
